name: Check
on:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_models:
        description: Download official tokenizer assets and check against Rust reference IDs
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: ${{ inputs.verify_models == true }}
        run: npm run verify:models
